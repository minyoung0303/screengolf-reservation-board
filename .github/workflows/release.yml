name: Release

# v 로 시작하는 태그를 올리면 Windows 설치파일을 빌드해서 릴리스에 첨부한다.
#   git tag v1.0.3
#   git push origin v1.0.3
on:
  push:
    tags:
      - 'v*'

# 릴리스 생성과 파일 첨부에 쓰기 권한이 필요하다.
# 이 워크플로는 태그 푸시에만 반응하므로 pull request 로는 실행되지 않는다.
permissions:
  contents: write

jobs:
  release:
    name: 설치파일 빌드 후 릴리스 첨부
    runs-on: windows-latest

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7

      - name: Node 24 준비
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        # electron-builder 가 Electron 바이너리를 필요로 하므로
        # ci.yml 처럼 ELECTRON_SKIP_BINARY_DOWNLOAD 를 쓰지 않는다.
        run: npm ci

      # 깨진 빌드가 릴리스로 나가지 않도록 먼저 검증한다.
      - name: 타입 검사
        run: npm run typecheck

      - name: 자동 점검 (API 80개 항목)
        run: npm run smoke

      - name: 설치파일 빌드
        run: npm run dist

      - name: 산출물 확인
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw '설치파일이 생성되지 않았습니다.' }
          $exe | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,1))MB" }

      - name: 릴리스 노트 작성
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          @"
          ## 설치

          아래 첨부파일 YeyakBo-Setup-*.exe 를 받아서 실행하세요.

          1. 받은 파일을 두 번 클릭합니다.
          2. "Windows 의 PC 보호" 경고가 뜨면 **추가 정보** 를 누르고 **실행** 을 누릅니다.
             코드 서명 인증서를 쓰지 않아서 뜨는 경고입니다. 빌드 과정은 이 저장소의
             .github/workflows/release.yml 에 전부 공개되어 있습니다.
          3. 방화벽 알림이 뜨면 **개인 네트워크 허용** 에 체크합니다.
             이 단계를 건너뛰면 폰·태블릿에서 접속할 수 없습니다.
          4. 첫 실행 때 PIN 을 설정합니다. 숫자 4~8 자리입니다.

          설치가 끝나면 기본값 상태로 바로 쓸 수 있습니다.
          타석 10개, 08:30~21:00, 1인 1게임 30분, 정리 10분입니다.

          자세한 사용법: docs/manual/설치_매뉴얼.md
          폰·태블릿 접속: docs/manual/폰_태블릿_접속방법.md

          ## 소스

          이 프로그램은 GNU Affero General Public License v3.0 으로 배포됩니다.
          이 설치파일에 대응하는 전체 소스는 아래에서 받을 수 있습니다.

          https://github.com/$repo/tree/$tag
          "@ | Set-Content -Path release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: 릴리스 생성
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = (Get-ChildItem release/*.exe).FullName
          gh release create $tag $files --title "예약보드 $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw '릴리스 생성 실패' }
